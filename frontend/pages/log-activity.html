<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Bike Logbook Telemetry v3.0</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-tint": "#abd600",
            "on-secondary": "#003640",
            "secondary": "#4cd7f6",
            "error-container": "#93000a",
            "on-surface": "#dce1fb",
            "on-background": "#dce1fb",
            "surface-container-highest": "#2e3447",
            "on-primary": "#283500",
            "error": "#ffb4ab",
            "on-surface-variant": "#c4c9ac",
            "surface-container-lowest": "#070d1f",
            "primary": "#ffffff",
            "on-error": "#690005",
            "primary-container": "#c3f400",
            "surface-container": "#191f31",
            "tertiary-container": "#6ffbbe",
            "surface-container-high": "#23293c",
            "surface-container-low": "#151b2d",
            "background": "#0c1324",
            "tertiary-fixed": "#6ffbbe",
            "outline-variant": "#444933",
            "primary-fixed": "#c3f400",
            "secondary-container": "#03b5d3",
            "tertiary-fixed-dim": "#4edea3",
            "outline": "#8e9379",
            "surface": "#0c1324"
          },
          spacing: {
            "margin-desktop": "2rem",
            "gutter-desktop": "1.5rem",
            "space-xl": "2.5rem",
            "space-lg": "1.5rem",
            "space-md": "1rem",
            "space-sm": "0.5rem",
            "space-xs": "0.25rem"
          },
          fontFamily: {
            "headline-lg": ["Space Grotesk"],
            "headline-md": ["Space Grotesk"],
            "headline-sm": ["Space Grotesk"],
            "body-md": ["Inter"],
            "body-sm": ["Inter"],
            "telemetry-data": ["JetBrains Mono"],
            "telemetry-metric-md": ["JetBrains Mono"],
            "telemetry-metric-lg": ["JetBrains Mono"],
            "label-caps": ["JetBrains Mono"]
          },
          fontSize: {
            "headline-lg": ["32px", { lineHeight: "38px", fontWeight: "600" }],
            "headline-md": ["22px", { lineHeight: "28px", fontWeight: "600" }],
            "headline-sm": ["18px", { lineHeight: "24px", fontWeight: "600" }],
            "body-md": ["14px", { lineHeight: "20px" }],
            "body-sm": ["12px", { lineHeight: "16px" }],
            "telemetry-data": ["13px", { lineHeight: "18px" }],
            "telemetry-metric-md": ["20px", { lineHeight: "26px", fontWeight: "600" }],
            "telemetry-metric-lg": ["30px", { lineHeight: "34px", fontWeight: "700" }],
            "label-caps": ["11px", { lineHeight: "14px", letterSpacing: "0.08em", fontWeight: "600" }]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen">
  <header class="fixed top-0 left-0 right-0 z-50 bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.4)]">
    <div class="h-16 w-full px-margin-desktop flex items-center justify-between gap-4">
      <div class="flex items-center gap-6">
        <a href="/" class="flex items-center gap-2">
          <span class="font-headline-sm text-headline-sm font-bold text-primary">Bike Logbook</span>
          <span class="font-label-caps text-label-caps uppercase px-1.5 py-0.5 rounded bg-surface-container text-surface-tint">v3.0</span>
        </a>
        <nav class="flex items-center gap-5 text-body-md">
          <a class="transition-colors py-1 text-on-surface-variant hover:text-on-surface" href="/">Dashboard</a>
<a class="transition-colors py-1 text-primary-container font-semibold" href="/log-activity">Log Activity</a>
<a class="transition-colors py-1 text-on-surface-variant hover:text-on-surface" href="/ledger">History & Ledger</a>
<a class="transition-colors py-1 text-on-surface-variant hover:text-on-surface" href="/garage">Garage & Components</a>
        </nav>
      </div>
      <div class="flex items-center gap-2">
        <button data-action="sync-strava" class="flex items-center gap-1.5 px-3 py-1.5 rounded bg-surface-container-high hover:bg-surface-container-highest text-secondary transition-all" type="button">
          <span class="material-symbols-outlined text-[16px]">bolt</span>
          <span class="font-label-caps text-label-caps uppercase font-semibold">Sync Strava</span>
        </button>
        <div id="nav-auth-slot" class="flex items-center gap-2"></div>
      </div>
    </div>
  </header>
  <main class="w-full pt-16 min-h-[calc(100vh-64px)]">
    
    <div class="w-full px-margin-desktop py-space-xl max-w-[1100px] mx-auto space-y-space-xl">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-space-md bg-surface-container-low p-space-lg rounded-xl">
        <div>
          <span class="font-label-caps text-label-caps uppercase text-secondary">TELEMETRY & WORKSHOP CONSOLE</span>
          <h1 class="font-headline-lg text-headline-lg text-primary font-bold">Log Ride or Maintenance</h1>
        </div>
        <div class="inline-flex p-1 rounded-xl bg-surface-container-lowest">
          <button id="btn-mode-ride" class="px-4 py-2 rounded-lg bg-surface-container-high text-primary-container font-label-caps text-label-caps uppercase font-bold" type="button">1. Log Ride</button>
          <button id="btn-mode-service" class="px-4 py-2 rounded-lg text-on-surface-variant font-label-caps text-label-caps uppercase font-bold" type="button">2. Maintenance & Cost</button>
        </div>
      </div>

      <form id="form-manual-ride" class="bg-surface-container-low p-space-lg rounded-xl space-y-4">
        <h2 class="font-headline-md text-headline-md text-primary font-bold">Manual Ride Entry</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="font-label-caps text-label-caps uppercase text-on-surface-variant block mb-1">Bicycle</label>
            <select id="ride-bike-select" name="bike_id" required class="w-full bg-surface-container-lowest text-primary font-telemetry-data p-3 rounded"></select>
          </div>
          <div>
            <label class="font-label-caps text-label-caps uppercase text-on-surface-variant block mb-1">Ride Title</label>
            <input type="text" name="title" required placeholder="e.g. Morning Gravel Loop" class="w-full bg-surface-container-lowest text-primary p-3 rounded"/>
          </div>
          <div>
            <label class="font-label-caps text-label-caps uppercase text-on-surface-variant block mb-1">Distance (KM)</label>
            <input type="number" step="0.01" name="distance_km" required placeholder="42.50" class="w-full bg-surface-container-lowest text-primary-container font-telemetry-metric-md p-2.5 rounded"/>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="font-label-caps text-label-caps uppercase text-on-surface-variant block mb-1">Ride Type</label>
            <select name="ride_type" class="w-full bg-surface-container-lowest text-primary font-telemetry-data p-3 rounded">
              <option value="Road">Road</option>
              <option value="Gravel" selected>Gravel</option>
              <option value="Commute">Commute</option>
              <option value="Trainer/Ind.">Trainer/Ind.</option>
            </select>
          </div>
          <div>
            <label class="font-label-caps text-label-caps uppercase text-on-surface-variant block mb-1">Date & Time</label>
            <input type="datetime-local" id="ride-date-input" name="ride_date" required class="w-full bg-surface-container-lowest text-primary font-telemetry-data p-3 rounded"/>
          </div>
          <div>
            <label class="font-label-caps text-label-caps uppercase text-on-surface-variant block mb-1">Elevation Gain (M)</label>
            <input type="number" name="elevation_gain_m" value="0" class="w-full bg-surface-container-lowest text-primary font-telemetry-data p-3 rounded"/>
          </div>
        </div>
        <div>
          <label class="font-label-caps text-label-caps uppercase text-on-surface-variant block mb-1">Notes</label>
          <textarea name="notes" rows="2" placeholder="Kondisi rute, tekanan ban, performa shifting..." class="w-full bg-surface-container-lowest text-primary p-3 rounded"></textarea>
        </div>
        <div class="flex justify-end">
          <button type="submit" class="px-6 py-3 rounded-xl bg-primary-container text-on-primary font-label-caps uppercase font-bold">Save Ride & Update Component Wear</button>
        </div>
      </form>

      <form id="form-maintenance-entry" class="hidden bg-surface-container-low p-space-lg rounded-xl space-y-4">
        <h2 class="font-headline-md text-headline-md text-primary font-bold">Maintenance & Component Action</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="font-label-caps text-label-caps uppercase text-on-surface-variant block mb-1">Select Active Component</label>
            <select id="maint-comp-select" name="component_id" required class="w-full bg-surface-container-lowest text-primary font-telemetry-data p-3 rounded"></select>
          </div>
          <div>
            <label class="font-label-caps text-label-caps uppercase text-on-surface-variant block mb-1">Operation Type</label>
            <select id="maint-action-type" name="action_type" class="w-full bg-surface-container-lowest text-secondary font-telemetry-data p-3 rounded">
              <option value="reset">Reset Interval Counter (Lube / Wax / Tune-up)</option>
              <option value="replace">Archive Old & Install New Replacement Part</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="font-label-caps text-label-caps uppercase text-on-surface-variant block mb-1">Service / New Part Title</label>
            <input type="text" name="title" required placeholder="e.g. Hot Wax Chain / New HG-601" class="w-full bg-surface-container-lowest text-primary p-3 rounded"/>
          </div>
          <div>
            <label class="font-label-caps text-label-caps uppercase text-on-surface-variant block mb-1">Cost (IDR)</label>
            <input type="number" name="cost_idr" value="0" class="w-full bg-surface-container-lowest text-primary font-telemetry-data p-3 rounded"/>
          </div>
          <div>
            <label class="font-label-caps text-label-caps uppercase text-on-surface-variant block mb-1">Workshop</label>
            <input type="text" name="workshop_name" value="Self-maintained (Home Workshop)" class="w-full bg-surface-container-lowest text-primary p-3 rounded"/>
          </div>
        </div>
        <div>
          <label class="font-label-caps text-label-caps uppercase text-on-surface-variant block mb-1">Technical Notes</label>
          <textarea name="notes" rows="2" placeholder="Catatan teknis atau alasan penggantian part..." class="w-full bg-surface-container-lowest text-primary p-3 rounded"></textarea>
        </div>
        <div class="flex justify-end">
          <button type="submit" class="px-6 py-3 rounded-xl bg-secondary text-on-secondary font-label-caps uppercase font-bold">Commit Service Record</button>
        </div>
      </form>
    </div>
    
  </main>
  <footer class="w-full bg-surface-container-lowest py-6 px-margin-desktop flex flex-col md:flex-row items-center justify-between gap-4 font-telemetry-data text-body-sm text-on-surface-variant">
    <span class="text-primary font-semibold">Bike Logbook Telemetry v3.0</span>
    <span class="font-label-caps text-label-caps text-outline">VERCEL • SUPABASE • STRAVA API • GOOGLE SHEETS</span>
  </footer>
  <script type="module" src="/js/controllers/log-activity-controller.js"></script>
  <script type="module" src="/js/controllers/app-controller.js"></script>
</body>
</html>
