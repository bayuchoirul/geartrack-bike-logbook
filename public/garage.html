<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GearTrack — Garasi & Komponen</title>
  <link rel="stylesheet" href="/css/telemetry.css" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 pb-24 md:pb-12">
  <div id="app-shell"></div>

  <main class="max-w-6xl mx-auto px-4 pt-6 space-y-8">
    <section class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <h1 data-i18n="garage.title" class="text-xl sm:text-2xl font-bold tracking-tight text-white">
          Garasi & Komponen
        </h1>
        <p data-i18n="garage.subtitle" class="text-xs sm:text-sm text-slate-400 mt-1">
          Pantau odometer armada dan batas keausan komponen.
        </p>
      </div>

      <div class="grid grid-cols-2 sm:flex items-center gap-2.5">
        <button
          type="button"
          id="btn-open-bike-modal"
          data-i18n="garage.add_bike"
          class="rounded-xl border border-slate-700 bg-slate-900 px-3.5 py-2.5 text-xs sm:text-sm font-semibold text-slate-200 hover:bg-slate-800 transition">
          + Tambah Sepeda
        </button>
        <button
          type="button"
          id="btn-open-component-modal"
          data-i18n="garage.add_component"
          class="rounded-xl bg-pink-600 px-3.5 py-2.5 text-xs sm:text-sm font-semibold text-white hover:bg-pink-500 transition">
          + Pasang Komponen
        </button>
      </div>
    </section>

    <section class="space-y-3">
      <h2 data-i18n="garage.fleet_heading" class="text-sm sm:text-base font-semibold text-white">
        Armada Sepeda
      </h2>
      <div id="bike-list"></div>
    </section>

    <section class="space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div class="flex items-center gap-2.5">
          <h2 data-i18n="garage.components_heading" class="text-sm sm:text-base font-semibold text-white">
            Status Keausan Komponen
          </h2>
          <span
            id="attention-badge"
            class="hidden rounded-full border border-amber-500/40 bg-amber-500/15 px-2.5 py-0.5 text-xs font-bold tabular-nums text-amber-300">
            0
          </span>
        </div>

        <select
          id="filter-garage-bike"
          aria-label="Filter sepeda garasi"
          class="w-full sm:w-56 rounded-xl border border-slate-800 bg-slate-900 px-3.5 py-2 text-xs sm:text-sm text-slate-200 focus:border-pink-500 focus:outline-none">
        </select>
      </div>

      <div id="component-wear-list"></div>
    </section>
  </main>

  <div
    id="modal-bike"
    data-modal-backdrop
    class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm items-end md:items-center justify-center p-0 md:p-4">
    <div class="w-full md:max-w-md rounded-t-2xl md:rounded-2xl border border-slate-800 bg-slate-900 p-5 sm:p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 data-i18n="garage.modal_bike_title" class="text-base font-bold text-white">
          Data Sepeda
        </h3>
        <button
          type="button"
          data-close-modal="modal-bike"
          class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-800 hover:text-white">
          ✕
        </button>
      </div>

      <form id="form-bike" class="space-y-4">
        <input type="hidden" name="id" />

        <div class="space-y-1.5">
          <label for="bike-name" data-i18n="garage.field_bike_name" class="block text-xs font-medium text-slate-300">
            Nama Sepeda
          </label>
          <input
            id="bike-name"
            name="name"
            type="text"
            required
            placeholder="Polygon Path X4"
            class="w-full rounded-xl border border-slate-800 bg-slate-950 px-3.5 py-2.5 text-sm text-white focus:border-pink-500 focus:outline-none" />
        </div>

        <div class="space-y-1.5">
          <label for="bike-brand" data-i18n="garage.field_brand" class="block text-xs font-medium text-slate-300">
            Merek & Model
          </label>
          <input
            id="bike-brand"
            name="brandModel"
            type="text"
            placeholder="Custom #ff3989 · Shimano 105 R7000"
            class="w-full rounded-xl border border-slate-800 bg-slate-950 px-3.5 py-2.5 text-sm text-white focus:border-pink-500 focus:outline-none" />
        </div>

        <div class="space-y-1.5">
          <label for="bike-odometer" data-i18n="garage.field_odometer" class="block text-xs font-medium text-slate-300">
            Total Odometer (km)
          </label>
          <input
            id="bike-odometer"
            name="totalOdometerKm"
            type="number"
            step="0.1"
            min="0"
            required
            class="w-full rounded-xl border border-slate-800 bg-slate-950 px-3.5 py-2.5 text-sm text-white focus:border-pink-500 focus:outline-none" />
        </div>

        <label class="flex items-center gap-2.5 text-xs text-slate-300 cursor-pointer">
          <input type="checkbox" name="isArchived" class="rounded border-slate-700 bg-slate-950 text-pink-600 focus:ring-pink-500" />
          <span data-i18n="garage.field_archive">Arsipkan sepeda ini</span>
        </label>

        <div class="grid grid-cols-2 gap-2.5 pt-2">
          <button
            type="button"
            data-close-modal="modal-bike"
            data-i18n="common.cancel"
            class="rounded-xl border border-slate-700 py-2.5 text-sm font-medium text-slate-300 hover:bg-slate-800">
            Batal
          </button>
          <button
            type="submit"
            id="btn-save-bike"
            data-i18n="common.save"
            class="rounded-xl bg-pink-600 py-2.5 text-sm font-semibold text-white hover:bg-pink-500">
            Simpan
          </button>
        </div>
      </form>
    </div>
  </div>

  <div
    id="modal-component"
    data-modal-backdrop
    class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm items-end md:items-center justify-center p-0 md:p-4">
    <div class="w-full md:max-w-md rounded-t-2xl md:rounded-2xl border border-slate-800 bg-slate-900 p-5 sm:p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 data-i18n="garage.modal_comp_title" class="text-base font-bold text-white">
          Data Komponen
        </h3>
        <button
          type="button"
          data-close-modal="modal-component"
          class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-800 hover:text-white">
          ✕
        </button>
      </div>

      <form id="form-component" class="space-y-4">
        <input type="hidden" name="id" />

        <div class="space-y-1.5">
          <label for="comp-bike" data-i18n="common.select_bike" class="block text-xs font-medium text-slate-300">
            Pilih Sepeda
          </label>
          <select
            id="comp-bike"
            name="bikeId"
            required
            class="w-full rounded-xl border border-slate-800 bg-slate-950 px-3.5 py-2.5 text-sm text-white focus:border-pink-500 focus:outline-none">
          </select>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label for="comp-name" data-i18n="garage.field_comp_name" class="block text-xs font-medium text-slate-300">
              Nama Komponen
            </label>
            <input
              id="comp-name"
              name="name"
              type="text"
              required
              placeholder="Rantai Shimano CN-HG601"
              class="w-full rounded-xl border border-slate-800 bg-slate-950 px-3.5 py-2.5 text-sm text-white focus:border-pink-500 focus:outline-none" />
          </div>

          <div class="space-y-1.5">
            <label for="comp-category" data-i18n="common.category" class="block text-xs font-medium text-slate-300">
              Kategori
            </label>
            <select
              id="comp-category"
              name="category"
              class="w-full rounded-xl border border-slate-800 bg-slate-950 px-3.5 py-2.5 text-sm text-white focus:border-pink-500 focus:outline-none">
              <option value="Drivetrain">Drivetrain</option>
              <option value="Tires">Tires</option>
              <option value="Brakes">Brakes</option>
              <option value="Bearings">Bearings</option>
              <option value="Service">Service</option>
              <option value="Accessories">Accessories</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label for="comp-installed" data-i18n="garage.field_installed_km" class="block text-xs font-medium text-slate-300">
              Odometer Saat Pasang (km)
            </label>
            <input
              id="comp-installed"
              name="installedOdometerKm"
              type="number"
              step="0.1"
              min="0"
              required
              class="w-full rounded-xl border border-slate-800 bg-slate-950 px-3.5 py-2.5 text-sm text-white focus:border-pink-500 focus:outline-none" />
          </div>

          <div class="space-y-1.5">
            <label for="comp-lifespan" data-i18n="garage.field_lifespan_km" class="block text-xs font-medium text-slate-300">
              Target Umur Pakai (km)
            </label>
            <input
              id="comp-lifespan"
              name="lifespanKm"
              type="number"
              step="1"
              min="1"
              required
              class="w-full rounded-xl border border-slate-800 bg-slate-950 px-3.5 py-2.5 text-sm text-white focus:border-pink-500 focus:outline-none" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2.5 pt-2">
          <button
            type="button"
            data-close-modal="modal-component"
            data-i18n="common.cancel"
            class="rounded-xl border border-slate-700 py-2.5 text-sm font-medium text-slate-300 hover:bg-slate-800">
            Batal
          </button>
          <button
            type="submit"
            id="btn-save-component"
            data-i18n="common.save"
            class="rounded-xl bg-pink-600 py-2.5 text-sm font-semibold text-white hover:bg-pink-500">
            Simpan
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/js/controllers/garage-controller.js"></script>
</body>
</html>
