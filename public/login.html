<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GearTrack — Masuk</title>
  <link rel="stylesheet" href="/css/telemetry.css" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
  <div id="app-shell"></div>

  <main class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900/90 p-6 sm:p-8 shadow-2xl space-y-6">
      <div class="space-y-1.5 text-center">
        <h1 data-i18n="login.title" class="text-xl sm:text-2xl font-bold text-white">
          Masuk ke GearTrack
        </h1>
        <p data-i18n="login.subtitle" class="text-xs sm:text-sm text-slate-400">
          Kelola telemetri jarak tempuh dan keausan komponen sepeda.
        </p>
      </div>

      <div class="grid grid-cols-3 gap-1 rounded-xl bg-slate-950 p-1 border border-slate-800">
        <button type="button" data-auth-tab="signin" data-i18n="login.tab_signin"
          class="rounded-lg py-2 text-xs font-semibold bg-pink-600 text-white transition">
          Masuk
        </button>
        <button type="button" data-auth-tab="signup" data-i18n="login.tab_signup"
          class="rounded-lg py-2 text-xs font-semibold text-slate-400 hover:text-white transition">
          Daftar
        </button>
        <button type="button" data-auth-tab="reset" data-i18n="login.tab_reset"
          class="rounded-lg py-2 text-xs font-semibold text-slate-400 hover:text-white transition">
          Reset Sandi
        </button>
      </div>

      <form id="form-auth" class="space-y-4">
        <div class="space-y-1.5">
          <label for="auth-email" data-i18n="login.email" class="block text-xs font-medium text-slate-300">
            Alamat Email
          </label>
          <input
            id="auth-email"
            name="email"
            type="email"
            autocomplete="email"
            required
            placeholder="nama@email.com"
            class="w-full rounded-xl border border-slate-800 bg-slate-950 px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:border-pink-500 focus:outline-none" />
        </div>

        <div id="group-auth-password" class="space-y-1.5">
          <label for="auth-password" data-i18n="login.password" class="block text-xs font-medium text-slate-300">
            Kata Sandi
          </label>
          <input
            id="auth-password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="••••••••"
            class="w-full rounded-xl border border-slate-800 bg-slate-950 px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:border-pink-500 focus:outline-none" />
        </div>

        <button
          type="submit"
          id="btn-auth-submit"
          data-i18n="login.submit_signin"
          class="w-full rounded-xl bg-pink-600 px-4 py-3 text-sm font-semibold text-white hover:bg-pink-500 transition">
          Masuk Sekarang
        </button>
      </form>
    </div>
  </main>

  <script type="module" src="/js/controllers/login-controller.js"></script>
</body>
</html>
